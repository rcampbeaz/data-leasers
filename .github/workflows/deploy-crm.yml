name: Deploy CRM

on:
  push:
    branches: [main]
    paths:
      - "crm/**"
      - ".github/workflows/deploy-crm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-crm
  cancel-in-progress: false

env:
  REMOTE_DIR: /home/dataleasers/domains/app.dataleasers.com/crm
  PM2_NAME: dl-crm
  APP_PORT: "3000"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy CRM source to server
        # Excludes .env so the server copy of secrets is never overwritten.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'node_modules/' --exclude '.next/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            crm/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

      - name: Install, build, and (re)start on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_DIR=${REMOTE_DIR} PM2_NAME=${PM2_NAME} APP_PORT=${APP_PORT} bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          test -f .env || { echo "Missing $REMOTE_DIR/.env on server. Create it first."; exit 1; }
          npm ci
          npm run build
          if npx --yes pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            npx --yes pm2 restart "$PM2_NAME" --update-env
          else
            npx --yes pm2 start npm --name "$PM2_NAME" -- start -- -p "$APP_PORT"
          fi
          npx --yes pm2 save
          REMOTE

      - name: Verify the CRM answers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -uo pipefail
          code=""
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.dataleasers.com/login || true)
            if [ "$code" = "200" ]; then
              echo "app.dataleasers.com/login is up (Http-Status $code)."
              exit 0
            fi
            echo "Attempt $attempt: status $code. Retrying in 5s."
            sleep 5
          done

          echo "::error::app.dataleasers.com/login returned $code after deploy"
          echo "----- last 60 lines of the $PM2_NAME log -----"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "npx --yes pm2 logs '${PM2_NAME}' --nostream --lines 60" || true
          exit 1
