name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "eleventy.config.js"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the site
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Check the built site before uploading
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "::error::_site/index.html is missing"; exit 1; }
          test -f _site/site.css || { echo "::error::_site/site.css is missing"; exit 1; }

          # Every page in the sitemap must exist in the build output.
          fail=0
          while read -r path; do
            if [ ! -f "_site/${path}" ]; then
              echo "::error::sitemap.xml lists /${path} but _site/${path} does not exist"
              fail=1
            fi
          done < <(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||' \
                   | sed -e 's|^https://dataleasers\.com/||' | sed -e 's|^$|index.html|')
          exit $fail

      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy site to public_html
        # --delete removes pages deleted or renamed in the repo. Files excluded
        # here are never removed from the server: .htaccess and .well-known may
        # be managed by the host, not by this repo.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude '.htaccess' \
            --exclude '.well-known/' \
            --exclude 'error_log' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            _site/ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/dataleasers/public_html/"

      - name: Verify the live site
        run: |
          set -euo pipefail

          # The served copy must contain the title of the index.html we just sent.
          marker=$(grep -oE '<title>[^<]+' _site/index.html | head -1 | sed 's|<title>||' | sed 's/[[:space:]]*$//')
          if [ -z "$marker" ]; then
            echo "::warning::No <title> found in _site/index.html; skipping the content check."
          fi

          code=""
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 15 https://dataleasers.com/ || true)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://dataleasers.com/ || true)
            if [ "$code" = "200" ] && { [ -z "$marker" ] || printf '%s' "$body" | grep -qF "$marker"; }; then
              echo "dataleasers.com is serving the deployed build (Http-Status $code)."
              break
            fi
            echo "Attempt $attempt: status $code, content not updated yet. Retrying in 5s."
            sleep 5
          done

          if [ "$code" != "200" ]; then
            echo "::error::dataleasers.com returned $code after deploy"
            exit 1
          fi
          if [ -n "$marker" ] && ! printf '%s' "$body" | grep -qF "$marker"; then
            echo "::error::dataleasers.com responded but is not serving the new index.html (expected title: $marker)"
            exit 1
          fi

      - name: Check every page in the sitemap
        run: |
          set -euo pipefail
          fail=0
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
            printf '%s %s\n' "$code" "$url"
            [ "$code" = "200" ] || fail=1
          done < <(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||')
          exit $fail
