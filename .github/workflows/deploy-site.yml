name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "eleventy.config.js"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the site
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Check the built site before uploading
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "::error::_site/index.html is missing"; exit 1; }
          test -f _site/site.css || { echo "::error::_site/site.css is missing"; exit 1; }

          # Every page in the sitemap must exist in the build output.
          fail=0
          while read -r path; do
            if [ ! -f "_site/${path}" ]; then
              echo "::error::sitemap.xml lists /${path} but _site/${path} does not exist"
              fail=1
            fi
          done < <(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||' \
                   | sed -e 's|^https://dataleasers\.com/||' | sed -e 's|^$|index.html|')
          exit $fail

      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy site to public_html
        # --delete removes pages deleted or renamed in the repo. Files excluded
        # here are never removed from the server: .htaccess and .well-known may
        # be managed by the host, not by this repo.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude '.htaccess' \
            --exclude '.well-known/' \
            --exclude 'error_log' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            _site/ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/dataleasers/public_html/"

      - name: Verify the live site
        run: |
          set -euo pipefail

          # Verify the build by its content-addressed stylesheet. The CDN caches
          # HTML by path and ignores the query string, so a cached home page can
          # still be minutes behind an upload that finished. The stamped file has
          # a path nobody has requested before, so serving it byte for byte proves
          # this build is live; comparing a cached title only proves the edge is warm.
          stamped=$(grep -oE 'site\.[a-f0-9]+\.css' _site/index.html | head -1)
          if [ -z "$stamped" ]; then
            echo "::error::_site/index.html does not reference a stamped stylesheet"
            exit 1
          fi
          want=$(sha256sum "_site/${stamped}" | cut -d' ' -f1)

          served=""
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/live.css -w '%{http_code}' --max-time 15 "https://dataleasers.com/${stamped}" || true)
            got=$(sha256sum /tmp/live.css 2>/dev/null | cut -d' ' -f1 || true)
            if [ "$code" = "200" ] && [ "$got" = "$want" ]; then
              echo "dataleasers.com is serving ${stamped} from this build (Http-Status $code)."
              served=1
              break
            fi
            echo "Attempt $attempt: ${stamped} returned $code with a different body. Retrying in 5s."
            sleep 5
          done
          if [ -z "$served" ]; then
            echo "::error::dataleasers.com is not serving ${stamped} from this build"
            exit 1
          fi

          # The home page must answer too. Its body may still be a cached copy,
          # which is why the content-addressed check above is the authoritative one.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://dataleasers.com/ || true)
          if [ "$code" != "200" ]; then
            echo "::error::dataleasers.com returned $code after deploy"
            exit 1
          fi

      - name: Check every page in the sitemap
        run: |
          set -euo pipefail
          fail=0
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
            printf '%s %s\n' "$code" "$url"
            [ "$code" = "200" ] || fail=1
          done < <(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||')
          exit $fail
